<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake.io</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; font-family:'Segoe UI',Arial,sans-serif; overflow:hidden; color:#fff; user-select:none; }
canvas { position:fixed; top:0; left:0; }

.screen {
  position:fixed; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(4,8,18,0.93);
  z-index:20;
}
.screen.hidden { display:none; }

#start-screen h1 {
  font-size:80px; font-weight:900; letter-spacing:4px;
  background:linear-gradient(135deg,#4ade80,#22d3ee);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 30px #4ade8055);
  margin-bottom:4px;
}
#start-screen .tagline { color:#475569; font-size:14px; margin-bottom:36px; letter-spacing:1px; }

input[type=text] {
  background:rgba(255,255,255,0.06); border:2px solid #1e3a29;
  border-radius:12px; padding:13px 22px; font-size:20px; color:#fff;
  text-align:center; outline:none; width:270px; margin-bottom:18px;
  transition:border-color .2s, box-shadow .2s;
}
input[type=text]:focus { border-color:#4ade80; box-shadow:0 0 18px #4ade8033; }

.skins { display:flex; gap:10px; margin-bottom:26px; }
.skin-dot {
  width:38px; height:38px; border-radius:50%; cursor:pointer;
  border:3px solid transparent; transition:transform .15s, border-color .15s;
  box-shadow:inset 0 0 8px rgba(0,0,0,0.4);
}
.skin-dot.on { border-color:#fff; transform:scale(1.22); }

.btn {
  padding:15px 60px; font-size:21px; font-weight:800; border:none;
  border-radius:999px; cursor:pointer; letter-spacing:1px;
  transition:transform .15s, filter .15s;
}
.btn:hover { transform:scale(1.07); filter:brightness(1.15); }
.btn-green { background:linear-gradient(135deg,#4ade80,#06b6d4); color:#041a10; box-shadow:0 0 28px #4ade8066; }
.btn-red   { background:linear-gradient(135deg,#f87171,#fb923c); color:#fff; box-shadow:0 0 28px #f8717166; }

#death-screen h2 { font-size:60px; font-weight:900; color:#f87171; text-shadow:0 0 40px #f8717177; margin-bottom:10px; }
#death-stats { font-size:17px; color:#94a3b8; margin-bottom:30px; line-height:2.1; text-align:center; }
#death-stats b { color:#e2e8f0; }

/* HUD */
#hud { position:fixed; top:0; left:0; right:0; padding:14px 18px; display:flex; justify-content:space-between; pointer-events:none; z-index:10; }
#hud.hidden { display:none; }
.panel { background:rgba(0,0,0,0.6); border-radius:14px; padding:11px 17px; backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.06); }

#score-panel .lbl { font-size:10px; color:#4ade80; text-transform:uppercase; letter-spacing:2px; }
#score-panel .val { font-size:36px; font-weight:900; color:#fff; line-height:1.05; }
#score-panel .sub { font-size:12px; color:#64748b; margin-top:2px; }

#lb h3 { font-size:10px; color:#4ade80; text-transform:uppercase; letter-spacing:2px; margin-bottom:7px; }
.lb-row { font-size:13px; display:flex; justify-content:space-between; gap:14px; padding:2px 0; color:#94a3b8; }
.lb-me  { color:#4ade80; font-weight:700; }
.lb-1st { color:#fbbf24; }

/* Kill feed */
#killfeed { position:fixed; top:80px; left:50%; transform:translateX(-50%); z-index:15; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:6px; }
.kf-item { background:rgba(0,0,0,0.7); border-radius:20px; padding:5px 16px; font-size:13px; font-weight:600; animation:kfin .3s ease; border:1px solid rgba(255,255,255,0.08); }
@keyframes kfin { from { opacity:0; transform:translateY(-8px) scale(0.9); } to { opacity:1; transform:none; } }

/* Minimap */
#minimap { position:fixed; bottom:16px; right:16px; border-radius:10px; border:2px solid rgba(255,255,255,0.1); z-index:10; }
#minimap.hidden { display:none; }

/* Boost bar */
#boost-bar-wrap { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:10; pointer-events:none; }
#boost-bar-wrap.hidden { display:none; }
#boost-track { width:180px; height:8px; background:rgba(255,255,255,0.1); border-radius:99px; overflow:hidden; }
#boost-fill  { height:100%; border-radius:99px; transition:background .3s; }
#boost-label { font-size:10px; color:#64748b; text-align:center; margin-top:3px; letter-spacing:1px; text-transform:uppercase; }
</style>
</head>
<body>

<canvas id="gc"></canvas>
<canvas id="minimap" width="140" height="140"></canvas>

<!-- Start -->
<div id="start-screen" class="screen">
  <h1>SNAKE.IO</h1>
  <p class="tagline">EAT · GROW · DOMINATE</p>
  <input id="name-inp" type="text" value="Player" maxlength="16" placeholder="Enter name" />
  <div class="skins" id="skins"></div>
  <button class="btn btn-green" id="play-btn">PLAY</button>
</div>

<!-- Death -->
<div id="death-screen" class="screen hidden">
  <h2>YOU DIED</h2>
  <div id="death-stats"></div>
  <button class="btn btn-red" id="retry-btn">PLAY AGAIN</button>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="panel" id="score-panel">
    <div class="lbl">Score</div>
    <div class="val" id="sv">0</div>
    <div class="sub" id="lv">Length 10</div>
  </div>
  <div class="panel" id="lb">
    <h3>Top Players</h3>
    <div id="lb-rows"></div>
  </div>
</div>

<div id="killfeed"></div>

<div id="boost-bar-wrap" class="hidden">
  <div id="boost-track"><div id="boost-fill"></div></div>
  <div id="boost-label">BOOST</div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════
const WORLD     = 4000;
const SEG_R     = 11;
const SPEED     = 2.8;
const BOOST_SPD = 5.6;
const TURN      = 0.072;
const NUM_ORBS  = 700;
const NUM_BOTS  = 16;
const ZOOM_BASE = 1.0;
const ZOOM_MIN  = 0.45;

const SKINS = [
  { h:'#4ade80', b:'#15803d', g:'#bbf7d0' },
  { h:'#60a5fa', b:'#1d4ed8', g:'#bfdbfe' },
  { h:'#f87171', b:'#b91c1c', g:'#fecaca' },
  { h:'#fbbf24', b:'#b45309', g:'#fef3c7' },
  { h:'#a78bfa', b:'#6d28d9', g:'#ede9fe' },
  { h:'#fb923c', b:'#c2410c', g:'#ffedd5' },
  { h:'#f472b6', b:'#be185d', g:'#fce7f3' },
  { h:'#34d399', b:'#047857', g:'#d1fae5' },
];

const BOT_NAMES = ['Slithera','Kobra','Vipex','NagaX','Mamba','Taipan',
                   'Asp','Racer','Krait','Boidae','Serpo','Pythia',
                   'Anaconda','Venom','Noodle','Zephyr'];

// ═══════════════════════════════════════════════════════
// CANVAS / GLOBALS
// ═══════════════════════════════════════════════════════
const gc   = document.getElementById('gc');
const ctx  = gc.getContext('2d');
const mm   = document.getElementById('minimap');
const mctx = mm.getContext('2d');

let W = 0, H = 0;
let running = false, rafId = null;

let player = null, bots = [], orbs = [], sparks = [], killFeedItems = [];
let camX = 0, camY = 0, camZoom = 1;
let mX = 0, mY = 0, pressing = false;
let score = 0, kills = 0, born = 0;
let skinIdx = 0, pName = 'Player';

function resize() { W = gc.width = window.innerWidth; H = gc.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════════════════
// SKIN SELECTOR
// ═══════════════════════════════════════════════════════
const skinsEl = document.getElementById('skins');
SKINS.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'skin-dot' + (i === 0 ? ' on' : '');
  d.style.background = `radial-gradient(circle at 35% 35%, ${s.g}, ${s.h} 60%, ${s.b})`;
  d.onclick = () => {
    document.querySelectorAll('.skin-dot').forEach(x => x.classList.remove('on'));
    d.classList.add('on');
    skinIdx = i;
  };
  skinsEl.appendChild(d);
});

// ═══════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════
gc.addEventListener('mousemove', e => { mX = e.clientX; mY = e.clientY; });
gc.addEventListener('mousedown', e => { if (e.button === 0) pressing = true; });
gc.addEventListener('mouseup',   e => { if (e.button === 0) pressing = false; });
gc.addEventListener('touchmove', e => { e.preventDefault(); mX = e.touches[0].clientX; mY = e.touches[0].clientY; }, { passive: false });
gc.addEventListener('touchstart', e => { mX = e.touches[0].clientX; mY = e.touches[0].clientY; pressing = e.touches.length > 1; });
gc.addEventListener('touchend', () => { pressing = false; });

// ═══════════════════════════════════════════════════════
// MATH HELPERS
// ═══════════════════════════════════════════════════════
const wrap = v => ((v % WORLD) + WORLD) % WORLD;
const wdelta = (a, b) => { let d = a - b; if (d > WORLD/2) d -= WORLD; if (d < -WORLD/2) d += WORLD; return d; };
const dist2  = (ax,ay,bx,by) => { const dx=wdelta(ax,bx),dy=wdelta(ay,by); return dx*dx+dy*dy; };
const atan2w = (ax,ay,bx,by) => Math.atan2(wdelta(by,ay), wdelta(bx,ax));
const lerp   = (a,b,t) => a + (b-a)*t;
const clamp  = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

// ═══════════════════════════════════════════════════════
// FACTORIES
// ═══════════════════════════════════════════════════════
function makeSnake(x, y, skin, name, isPlayer) {
  const segs = [];
  for (let i = 0; i < 12; i++) segs.push({ x: wrap(x - i * SEG_R * 2.2), y });
  return { segs, angle:0, skin, name, isPlayer, alive:true, len:12, fuel:100, points:0,
           boosting:false, tongueOut:0, tongueSide:1 };
}

function makeOrb(x, y) {
  const hue = (Math.random() * 360)|0;
  const big = Math.random() < 0.06; // rare big orbs
  return { x: x??Math.random()*WORLD, y: y??Math.random()*WORLD,
           r: big ? 12 + Math.random()*6 : 4 + Math.random()*5,
           hue, phase: Math.random()*Math.PI*2, big };
}

function burst(x, y, color, n, speed=1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, s=(1.5+Math.random()*4)*speed;
    sparks.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, r:2+Math.random()*3.5, color });
  }
}

// ═══════════════════════════════════════════════════════
// START / SCREENS
// ═══════════════════════════════════════════════════════
function setScreen(which) {
  document.getElementById('start-screen').classList.toggle('hidden', which!=='start');
  document.getElementById('death-screen').classList.toggle('hidden', which!=='death');
  document.getElementById('hud').classList.toggle('hidden', which!=='game');
  document.getElementById('boost-bar-wrap').classList.toggle('hidden', which!=='game');
  mm.classList.toggle('hidden', which!=='game');
}
setScreen('start');

function startGame() {
  pName   = document.getElementById('name-inp').value.trim() || 'Player';
  score   = 0; kills = 0; born = Date.now();
  sparks  = []; orbs = []; bots = []; killFeedItems = [];
  document.getElementById('killfeed').innerHTML = '';

  for (let i = 0; i < NUM_ORBS; i++) orbs.push(makeOrb());

  const sx = WORLD/2, sy = WORLD/2;
  player = makeSnake(sx, sy, SKINS[skinIdx], pName, true);
  mX = W/2; mY = H/2 - 1;
  camX = sx - W/2; camY = sy - H/2; camZoom = 1;

  for (let i = 0; i < NUM_BOTS; i++) {
    const bx = 500 + Math.random()*(WORLD-1000);
    const by = 500 + Math.random()*(WORLD-1000);
    bots.push({
      snake: makeSnake(bx, by, SKINS[(skinIdx+1+i)%SKINS.length], BOT_NAMES[i%BOT_NAMES.length], false),
      timer:0, targetAngle: Math.random()*Math.PI*2, mode:'wander',
    });
  }

  setScreen('game');
  running = true;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tick);
}

document.getElementById('play-btn').onclick = startGame;
document.getElementById('name-inp').addEventListener('keydown', e => { if(e.key==='Enter') startGame(); });
document.getElementById('retry-btn').onclick = startGame;

// ═══════════════════════════════════════════════════════
// STEER
// ═══════════════════════════════════════════════════════
function steerPlayer(s) {
  const tx = mX - W/2, ty = mY - H/2;
  const target = Math.atan2(ty, tx);
  let diff = target - s.angle;
  while (diff >  Math.PI) diff -= 2*Math.PI;
  while (diff < -Math.PI) diff += 2*Math.PI;
  s.angle += Math.sign(diff) * Math.min(Math.abs(diff), TURN);
  s.boosting = pressing && s.fuel > 0;
}

function steerBot(bot) {
  const s = bot.snake;
  const head = s.segs[0];
  bot.timer--;

  if (bot.timer <= 0) {
    // Decide mode
    const playerAlive = player && player.alive;
    const pDist = playerAlive ? dist2(head.x, head.y, player.segs[0].x, player.segs[0].y) : Infinity;

    // Hunt player if close and bot is big enough
    if (playerAlive && pDist < 350*350 && s.len > player.len * 0.8) {
      bot.targetAngle = atan2w(head.x, head.y, player.segs[0].x, player.segs[0].y);
      bot.mode = 'hunt';
    } else {
      // Seek nearest orb
      let best = null, bd = Infinity;
      for (const o of orbs) {
        const d = dist2(head.x, head.y, o.x, o.y);
        if (d < bd) { bd = d; best = o; }
      }
      if (best) { bot.targetAngle = atan2w(head.x, head.y, best.x, best.y); bot.mode = 'forage'; }
      else      { bot.targetAngle += (Math.random()-0.5)*1.4; bot.mode = 'wander'; }
    }
    bot.timer = 20 + (Math.random()*50)|0;
  }

  // Edge avoid
  const m = 250;
  if (head.x < m)         bot.targetAngle = lerp(bot.targetAngle, 0,       0.25);
  if (head.x > WORLD - m) bot.targetAngle = lerp(bot.targetAngle, Math.PI, 0.25);
  if (head.y < m)         bot.targetAngle = lerp(bot.targetAngle, Math.PI/2,  0.25);
  if (head.y > WORLD - m) bot.targetAngle = lerp(bot.targetAngle,-Math.PI/2, 0.25);

  let diff = bot.targetAngle - s.angle;
  while (diff >  Math.PI) diff -= 2*Math.PI;
  while (diff < -Math.PI) diff += 2*Math.PI;
  s.angle += Math.sign(diff) * Math.min(Math.abs(diff), TURN * 0.78);
  s.boosting = false;
}

// ═══════════════════════════════════════════════════════
// MOVE
// ═══════════════════════════════════════════════════════
function moveSnake(s) {
  if (s.boosting) {
    s.fuel = Math.max(0, s.fuel - 0.55);
    if (Math.random() < 0.35) {
      const tail = s.segs[s.segs.length-1];
      orbs.push(makeOrb(tail.x+(Math.random()-0.5)*10, tail.y+(Math.random()-0.5)*10));
    }
  } else {
    s.fuel = Math.min(100, s.fuel + 0.2);
  }

  const spd = s.boosting ? BOOST_SPD : SPEED;
  const head = s.segs[0];
  s.segs.unshift({ x: wrap(head.x + Math.cos(s.angle)*spd), y: wrap(head.y + Math.sin(s.angle)*spd) });
  while (s.segs.length > s.len) s.segs.pop();

  // Tongue animation
  s.tongueOut += s.boosting ? 0.3 : 0.1;
}

// ═══════════════════════════════════════════════════════
// EAT ORBS
// ═══════════════════════════════════════════════════════
function eatOrbs(s) {
  const head = s.segs[0];
  const r2 = (SEG_R + 9) ** 2;
  for (let i = orbs.length-1; i >= 0; i--) {
    if (dist2(head.x, head.y, orbs[i].x, orbs[i].y) < r2) {
      const o = orbs[i];
      const pts = (o.r * (o.big ? 3 : 1))|0;
      s.len    += o.big ? 3 : 1;
      s.points += pts;
      if (s.isPlayer) score += pts;
      burst(o.x, o.y, `hsl(${o.hue},80%,65%)`, o.big ? 10 : 4);
      orbs.splice(i, 1);
      orbs.push(makeOrb());
    }
  }
}

// ═══════════════════════════════════════════════════════
// COLLISIONS
// ═══════════════════════════════════════════════════════
function checkCollisions() {
  const all = [player, ...bots.map(b=>b.snake)].filter(s => s && s.alive);
  const kr2 = (SEG_R * 1.35)**2;
  for (const s of all) {
    if (!s.alive) continue;
    const hx = s.segs[0].x, hy = s.segs[0].y;
    for (const other of all) {
      if (!other.alive) continue;
      const skip = s === other ? 8 : 0;
      for (let i = skip; i < other.segs.length; i++) {
        if (dist2(hx, hy, other.segs[i].x, other.segs[i].y) < kr2) {
          killSnake(s, other);
          break;
        }
      }
      if (!s.alive) break;
    }
  }
}

function killSnake(s, killer) {
  s.alive = false;
  const drop = Math.min(s.segs.length, 30 + s.len);
  for (let i = 0; i < drop; i++) {
    const seg = s.segs[(Math.random()*s.segs.length)|0];
    orbs.push(makeOrb(seg.x+(Math.random()-0.5)*24, seg.y+(Math.random()-0.5)*24));
  }
  burst(s.segs[0].x, s.segs[0].y, s.skin.h, 30, 1.4);

  if (killer !== s) {
    if (killer.isPlayer) { kills++; addKillFeed(`You eliminated ${s.name}!`, '#4ade80'); }
    else if (s.isPlayer) { /* handled below */ }
    else { addKillFeed(`${killer.name} eliminated ${s.name}`, '#94a3b8'); }
  }

  if (s.isPlayer) {
    running = false;
    const secs = Math.floor((Date.now()-born)/1000);
    document.getElementById('death-stats').innerHTML =
      `Score <b>${score}</b><br>Length <b>${s.len}</b><br>Kills <b>${kills}</b><br>` +
      `Survived <b>${Math.floor(secs/60)}m ${secs%60}s</b>`;
    setScreen('death');
  }
}

// ═══════════════════════════════════════════════════════
// KILL FEED
// ═══════════════════════════════════════════════════════
function addKillFeed(msg, color) {
  const kf = document.getElementById('killfeed');
  const el = document.createElement('div');
  el.className = 'kf-item';
  el.style.color = color;
  el.textContent = msg;
  kf.prepend(el);
  killFeedItems.push({ el, born: Date.now() });
  if (kf.children.length > 4) kf.lastChild.remove();
}

function updateKillFeed() {
  const now = Date.now();
  for (let i = killFeedItems.length-1; i >= 0; i--) {
    const item = killFeedItems[i];
    const age = (now - item.born) / 3000;
    if (age > 1) { item.el.remove(); killFeedItems.splice(i,1); }
    else item.el.style.opacity = 1 - Math.max(0, (age - 0.7) / 0.3);
  }
}

// ═══════════════════════════════════════════════════════
// RESPAWN BOTS
// ═══════════════════════════════════════════════════════
function respawnBots() {
  for (const bot of bots) {
    if (!bot.snake.alive) {
      const bx = 500 + Math.random()*(WORLD-1000);
      const by = 500 + Math.random()*(WORLD-1000);
      bot.snake = makeSnake(bx, by, bot.snake.skin, bot.snake.name, false);
      bot.timer = 0;
    }
  }
}

// ═══════════════════════════════════════════════════════
// CAMERA (with zoom)
// ═══════════════════════════════════════════════════════
function updateCam() {
  if (!player || !player.alive) return;
  const hx = player.segs[0].x, hy = player.segs[0].y;
  camX = lerp(camX, hx - W/(2*camZoom), 0.1);
  camY = lerp(camY, hy - H/(2*camZoom), 0.1);
  // Zoom out as snake grows
  const targetZoom = clamp(ZOOM_BASE - (player.len - 12) * 0.003, ZOOM_MIN, ZOOM_BASE);
  camZoom = lerp(camZoom, targetZoom, 0.04);
}

function toScreen(wx, wy) {
  return [(wx - camX) * camZoom, (wy - camY) * camZoom];
}
function inView(sx, sy, pad=24) {
  return sx > -pad && sx < W+pad && sy > -pad && sy < H+pad;
}

// ═══════════════════════════════════════════════════════
// DRAW BACKGROUND
// ═══════════════════════════════════════════════════════
function drawBg() {
  ctx.fillStyle = '#080f08';
  ctx.fillRect(0, 0, W, H);

  // Dot grid instead of line grid — more snake.io-like
  const gs = 60 * camZoom;
  const ox = ((-camX * camZoom) % gs + gs) % gs;
  const oy = ((-camY * camZoom) % gs + gs) % gs;
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for (let x = ox; x < W; x += gs)
    for (let y = oy; y < H; y += gs)
      ctx.fillRect(x-1, y-1, 2, 2);

  // World border glow
  const [bx, by] = toScreen(0, 0);
  const bw = WORLD * camZoom, bh = WORLD * camZoom;
  const grad = ctx.createLinearGradient(bx, by, bx+bw, by+bh);
  grad.addColorStop(0, '#4ade80');
  grad.addColorStop(0.5, '#22d3ee');
  grad.addColorStop(1, '#4ade80');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 5 * camZoom;
  ctx.shadowColor = '#4ade80';
  ctx.shadowBlur = 18;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.shadowBlur = 0;
}

// ═══════════════════════════════════════════════════════
// DRAW ORBS
// ═══════════════════════════════════════════════════════
function drawOrbs(t) {
  for (const o of orbs) {
    const [sx, sy] = toScreen(o.x, o.y);
    if (!inView(sx, sy, 20)) continue;
    const pulse = o.r * camZoom * (0.82 + 0.18 * Math.sin(t*0.0025 + o.phase));
    const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, pulse);
    grd.addColorStop(0, `hsl(${o.hue},90%,85%)`);
    grd.addColorStop(0.5, `hsl(${o.hue},80%,60%)`);
    grd.addColorStop(1, `hsl(${o.hue},70%,40%)`);
    ctx.beginPath(); ctx.arc(sx, sy, pulse, 0, Math.PI*2);
    ctx.fillStyle = grd;
    ctx.shadowColor = `hsl(${o.hue},80%,70%)`;
    ctx.shadowBlur = o.big ? 16 : 7;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// ═══════════════════════════════════════════════════════
// DRAW SNAKE (smooth curved body)
// ═══════════════════════════════════════════════════════
function drawSnake(s, t) {
  if (!s.alive || s.segs.length < 3) return;
  const segs = s.segs;
  const n = segs.length;
  const zr = SEG_R * camZoom;

  // --- Draw body as smooth filled path ---
  // Build screen positions
  const pts = segs.map(seg => toScreen(seg.x, seg.y));

  // Only draw if head is somewhat in view (rough check)
  if (!inView(pts[0][0], pts[0][1], zr * n)) {
    // Fine-grained: check at least one seg in view
    let anyIn = false;
    for (let i = 0; i < pts.length; i += 4) {
      if (inView(pts[i][0], pts[i][1], zr * 4)) { anyIn = true; break; }
    }
    if (!anyIn) return;
  }

  // Draw body segments back-to-front
  for (let i = n - 1; i >= 1; i--) {
    const [sx, sy] = pts[i];
    if (!inView(sx, sy, zr * 2)) continue;

    const taper = 1 - (i / n) * 0.35;
    const r = zr * taper;
    const t2 = i / n;

    // Body gradient color
    const bright = Math.floor(lerp(35, 55, 1 - t2));
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI*2);
    ctx.fillStyle = s.skin.b;
    ctx.fill();

    // Shine highlight on top segments
    if (i % 5 === 0 && r > 4) {
      ctx.beginPath();
      ctx.arc(sx - r*0.25, sy - r*0.28, r * 0.38, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.13)';
      ctx.fill();
    }

    // Scale pattern
    if (i % 3 === 1 && r > 5) {
      ctx.beginPath();
      ctx.ellipse(sx, sy, r*0.55, r*0.38, s.angle + Math.PI/2, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fill();
    }
  }

  // --- Head ---
  const [hx, hy] = pts[0];
  const hr = zr * 1.35;

  // Boost trail / glow
  if (s.boosting) {
    // Speed lines
    for (let i = 1; i <= 5; i++) {
      const ti = Math.min(i * 3, n - 1);
      const [tx2, ty2] = pts[ti];
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(tx2, ty2);
      ctx.strokeStyle = s.skin.h + Math.floor(40 - i*6).toString(16).padStart(2,'0');
      ctx.lineWidth = Math.max(1, (6 - i) * camZoom);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(hx, hy, hr * 1.7, 0, Math.PI*2);
    ctx.fillStyle = s.skin.h + '22'; ctx.fill();
  }

  // Head base
  const hgrd = ctx.createRadialGradient(hx - hr*0.28, hy - hr*0.28, 0, hx, hy, hr);
  hgrd.addColorStop(0, s.skin.g);
  hgrd.addColorStop(0.5, s.skin.h);
  hgrd.addColorStop(1, s.skin.b);
  ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI*2);
  ctx.fillStyle = hgrd;
  ctx.shadowColor = s.skin.h;
  ctx.shadowBlur = s.boosting ? 18 : 8;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Eyes
  const ea = hr * 0.44;
  const ang = s.angle;
  for (const side of [-1, 1]) {
    const ex = hx + Math.cos(ang + side*0.52)*ea;
    const ey = hy + Math.sin(ang + side*0.52)*ea;
    const er = hr * 0.27;
    // Sclera
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    // Iris gradient
    const igrd = ctx.createRadialGradient(ex, ey, 0, ex, ey, er*0.85);
    igrd.addColorStop(0, '#222'); igrd.addColorStop(1, '#000');
    ctx.beginPath(); ctx.arc(ex + Math.cos(ang)*er*0.2, ey + Math.sin(ang)*er*0.2, er*0.58, 0, Math.PI*2);
    ctx.fillStyle = igrd; ctx.fill();
    // Pupil shine
    ctx.beginPath(); ctx.arc(ex + Math.cos(ang-0.8)*er*0.22, ey + Math.sin(ang-0.8)*er*0.22, er*0.2, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
  }

  // Tongue
  if (zr > 5) {
    const tonguePhase = Math.sin(s.tongueOut * (s.boosting ? 0.4 : 0.15));
    if (tonguePhase > 0.3) {
      const tLen = hr * (0.8 + tonguePhase * 0.5);
      const tx2 = hx + Math.cos(ang) * (hr + tLen);
      const ty2 = hy + Math.sin(ang) * (hr + tLen);
      ctx.beginPath();
      ctx.moveTo(hx + Math.cos(ang)*hr*0.9, hy + Math.sin(ang)*hr*0.9);
      ctx.lineTo(tx2, ty2);
      ctx.strokeStyle = '#f87171';
      ctx.lineWidth = Math.max(1, camZoom * 2);
      ctx.stroke();
      // Fork
      const fLen = tLen * 0.35;
      for (const fs of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(tx2, ty2);
        ctx.lineTo(tx2 + Math.cos(ang + fs*0.45)*fLen, ty2 + Math.sin(ang + fs*0.45)*fLen);
        ctx.stroke();
      }
    }
  }

  // Name label
  if (hr > 6) {
    const fontSize = clamp(11 * camZoom, 9, 16);
    ctx.font = `bold ${fontSize}px Segoe UI,Arial`;
    ctx.textAlign = 'center';
    const ny = hy - hr - 5 * camZoom;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillText(s.name, hx+1, ny+1);
    ctx.fillStyle = s.isPlayer ? '#4ade80' : '#fff';
    ctx.fillText(s.name, hx, ny);
  }
}

// ═══════════════════════════════════════════════════════
// DRAW SPARKS
// ═══════════════════════════════════════════════════════
function drawSparks() {
  for (const p of sparks) {
    const [sx, sy] = toScreen(p.x, p.y);
    ctx.globalAlpha = p.life * p.life;
    ctx.beginPath();
    ctx.arc(sx, sy, p.r * p.life * camZoom, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════
// MINIMAP
// ═══════════════════════════════════════════════════════
function drawMinimap() {
  const mw = mm.width, mh = mm.height;
  const sc = mw / WORLD;
  mctx.fillStyle = 'rgba(4,10,4,0.92)';
  mctx.fillRect(0, 0, mw, mh);

  // Border
  mctx.strokeStyle = '#4ade8066';
  mctx.lineWidth = 1;
  mctx.strokeRect(0, 0, mw, mh);

  // Orbs
  mctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (const o of orbs) mctx.fillRect(o.x*sc, o.y*sc, 1, 1);

  // Bots
  for (const bot of bots) {
    if (!bot.snake.alive) continue;
    const h = bot.snake.segs[0];
    mctx.fillStyle = bot.snake.skin.h;
    mctx.fillRect(h.x*sc-2, h.y*sc-2, 4, 4);
  }

  // Player
  if (player && player.alive) {
    const h = player.segs[0];
    mctx.fillStyle = '#fff';
    mctx.fillRect(h.x*sc-3, h.y*sc-3, 6, 6);
    mctx.strokeStyle = 'rgba(255,255,255,0.3)';
    mctx.lineWidth = 1;
    mctx.strokeRect(camX*sc, camY*sc, (W/camZoom)*sc, (H/camZoom)*sc);
  }
}

// ═══════════════════════════════════════════════════════
// HUD
// ═══════════════════════════════════════════════════════
function updateHUD() {
  document.getElementById('sv').textContent = score;
  document.getElementById('lv').textContent = `Length ${player?.len ?? 0}`;

  // Boost bar
  if (player && player.alive) {
    const pct = player.fuel / 100;
    const fill = document.getElementById('boost-fill');
    fill.style.width = (pct * 100) + '%';
    fill.style.background = pct > 0.5 ? 'linear-gradient(90deg,#4ade80,#22d3ee)' :
                            pct > 0.25 ? '#fbbf24' : '#f87171';
  }

  // Leaderboard
  const rows = [
    player ? { name: pName, pts: score, me: true } : null,
    ...bots.filter(b=>b.snake.alive).map(b=>({ name:b.snake.name, pts:b.snake.points, me:false })),
  ].filter(Boolean).sort((a,b)=>b.pts-a.pts).slice(0,8);

  document.getElementById('lb-rows').innerHTML = rows.map((r,i) =>
    `<div class="lb-row${r.me?' lb-me':''}${i===0?' lb-1st':''}">
      <span>${i+1}. ${r.name}</span><span>${r.pts}</span>
    </div>`
  ).join('');
}

// ═══════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════
function tick(t) {
  rafId = requestAnimationFrame(tick);
  if (!running) return;

  if (player && player.alive) {
    steerPlayer(player);
    moveSnake(player);
    eatOrbs(player);
  }
  for (const bot of bots) {
    if (bot.snake.alive) { steerBot(bot); moveSnake(bot.snake); eatOrbs(bot.snake); }
  }

  checkCollisions();
  respawnBots();

  for (let i = sparks.length-1; i >= 0; i--) {
    const p = sparks[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= 0.026;
    if (p.life <= 0) sparks.splice(i,1);
  }

  while (orbs.length < NUM_ORBS) orbs.push(makeOrb());
  updateCam();

  // Apply zoom transform
  ctx.save();
  ctx.scale(camZoom, camZoom);
  ctx.restore();

  drawBg();
  drawOrbs(t);
  for (const bot of bots) drawSnake(bot.snake, t);
  if (player) drawSnake(player, t);
  drawSparks();
  updateHUD();
  updateKillFeed();
  drawMinimap();
}

rafId = requestAnimationFrame(tick);
</script>
