<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake.io</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #111;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  color: #fff;
  user-select: none;
}

canvas {
  position: fixed;
  top: 0; left: 0;
}

/* ── Screens ── */
.screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(8, 12, 22, 0.92);
  z-index: 20;
}
.screen.hidden { display: none; }

#start-screen h1 {
  font-size: 72px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #4ade80;
  text-shadow: 0 0 40px #4ade8066;
  margin-bottom: 6px;
}
#start-screen p {
  color: #64748b;
  margin-bottom: 32px;
  font-size: 15px;
}

input[type=text] {
  background: rgba(255,255,255,0.07);
  border: 2px solid #334155;
  border-radius: 10px;
  padding: 12px 20px;
  font-size: 20px;
  color: #fff;
  text-align: center;
  outline: none;
  width: 260px;
  margin-bottom: 18px;
  transition: border-color .2s;
}
input[type=text]:focus { border-color: #4ade80; }

.skins {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
}
.skin-dot {
  width: 36px; height: 36px;
  border-radius: 50%;
  cursor: pointer;
  border: 3px solid transparent;
  transition: transform .15s, border-color .15s;
}
.skin-dot.on { border-color: #fff; transform: scale(1.2); }

.btn {
  padding: 14px 56px;
  font-size: 20px;
  font-weight: 800;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  transition: transform .15s;
}
.btn:hover { transform: scale(1.07); }
.btn-green { background: linear-gradient(135deg,#4ade80,#22c55e); color: #0a2010; box-shadow: 0 0 24px #4ade8055; }
.btn-red   { background: linear-gradient(135deg,#f87171,#ef4444); color: #fff;    box-shadow: 0 0 24px #f8717155; }

/* ── Death screen ── */
#death-screen h2 { font-size: 58px; font-weight:900; color:#f87171; text-shadow:0 0 30px #f8717188; margin-bottom:10px; }
#death-stats { font-size:17px; color:#94a3b8; margin-bottom:28px; line-height:2; text-align:center; }
#death-stats b { color:#fff; }

/* ── HUD ── */
#hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 10;
}
#hud.hidden { display: none; }

.panel {
  background: rgba(0,0,0,0.55);
  border-radius: 12px;
  padding: 10px 16px;
  backdrop-filter: blur(4px);
}
#score-panel .lbl { font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:1px; }
#score-panel .val { font-size:34px; font-weight:900; color:#4ade80; line-height:1; }
#score-panel .sub { font-size:12px; color:#86efac; margin-top:2px; }

#lb h3 { font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.lb-row { font-size:13px; display:flex; justify-content:space-between; gap:12px; padding:1px 0; }
.lb-me  { color:#4ade80; font-weight:700; }

#minimap-wrap {
  position: fixed;
  bottom: 14px; right: 14px;
  z-index: 10;
}
#minimap-wrap.hidden { display: none; }
#minimap {
  border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.12);
}
</style>
</head>
<body>

<!-- Canvases -->
<canvas id="gc"></canvas>
<canvas id="minimap" width="130" height="130"></canvas>

<!-- Start -->
<div id="start-screen" class="screen">
  <h1>SNAKE.IO</h1>
  <p>Eat orbs · Grow big · Outlast everyone</p>
  <input id="name-inp" type="text" value="Player" maxlength="16" placeholder="Your name" />
  <div class="skins" id="skins"></div>
  <button class="btn btn-green" id="play-btn">PLAY</button>
</div>

<!-- Death -->
<div id="death-screen" class="screen hidden">
  <h2>YOU DIED</h2>
  <div id="death-stats"></div>
  <button class="btn btn-red" id="retry-btn">PLAY AGAIN</button>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="panel" id="score-panel">
    <div class="lbl">Score</div>
    <div class="val" id="sv">0</div>
    <div class="sub" id="lv">Length 5</div>
  </div>
  <div class="panel" id="lb">
    <h3>Leaderboard</h3>
    <div id="lb-rows"></div>
  </div>
</div>

<div id="minimap-wrap" class="hidden">
  <!-- minimap canvas already in DOM -->
</div>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════
const WORLD      = 3000;
const SEG_R      = 10;       // segment radius
const SPEED      = 2.6;
const BOOST_SPD  = 5.2;
const TURN       = 0.07;
const NUM_ORBS   = 550;
const NUM_BOTS   = 12;

const SKINS = [
  { h:'#4ade80', b:'#16a34a' },
  { h:'#60a5fa', b:'#2563eb' },
  { h:'#f87171', b:'#dc2626' },
  { h:'#fbbf24', b:'#b45309' },
  { h:'#a78bfa', b:'#7c3aed' },
  { h:'#fb923c', b:'#ea580c' },
  { h:'#f472b6', b:'#db2777' },
  { h:'#34d399', b:'#059669' },
];

const BOT_NAMES = ['Slithera','Kobra','Vipex','NagaX','Mamba','Taipan',
                   'Asp','Racer','Krait','Boidae','Serpo','Pythia'];

// ═══════════════════════════════════════════════════════
//  CANVAS / STATE
// ═══════════════════════════════════════════════════════
const gc    = document.getElementById('gc');
const ctx   = gc.getContext('2d');
const mm    = document.getElementById('minimap');
const mctx  = mm.getContext('2d');

let W = 0, H = 0;
let running = false;
let rafId   = null;

let player  = null;
let bots    = [];
let orbs    = [];
let sparks  = [];

let camX = 0, camY = 0;
let mX = 0, mY = 0;
let pressing = false;

let score     = 0;
let kills     = 0;
let born      = 0;
let skinIdx   = 0;
let pName     = 'Player';

// ═══════════════════════════════════════════════════════
//  RESIZE
// ═══════════════════════════════════════════════════════
function resize() {
  W = gc.width  = window.innerWidth;
  H = gc.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════════════════
//  SKIN SELECTOR
// ═══════════════════════════════════════════════════════
const skinsEl = document.getElementById('skins');
SKINS.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'skin-dot' + (i === 0 ? ' on' : '');
  d.style.background = s.h;
  d.onclick = () => {
    document.querySelectorAll('.skin-dot').forEach(x => x.classList.remove('on'));
    d.classList.add('on');
    skinIdx = i;
  };
  skinsEl.appendChild(d);
});

// ═══════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════
gc.addEventListener('mousemove', e => { mX = e.clientX; mY = e.clientY; });
gc.addEventListener('mousedown', e => { if (e.button === 0) pressing = true; });
gc.addEventListener('mouseup',   e => { if (e.button === 0) pressing = false; });
gc.addEventListener('touchmove', e => {
  e.preventDefault();
  mX = e.touches[0].clientX;
  mY = e.touches[0].clientY;
}, { passive: false });
gc.addEventListener('touchstart', e => {
  mX = e.touches[0].clientX;
  mY = e.touches[0].clientY;
  pressing = e.touches.length > 1;
});
gc.addEventListener('touchend', () => { pressing = false; });

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
function wrapDelta(a, b) {
  let d = a - b;
  if (d >  WORLD / 2) d -= WORLD;
  if (d < -WORLD / 2) d += WORLD;
  return d;
}

function wrapCoord(v) {
  return ((v % WORLD) + WORLD) % WORLD;
}

function angleTo(ax, ay, bx, by) {
  return Math.atan2(wrapDelta(by, ay), wrapDelta(bx, ax));
}

function dist2(ax, ay, bx, by) {
  const dx = wrapDelta(ax, bx);
  const dy = wrapDelta(ay, by);
  return dx * dx + dy * dy;
}

// ═══════════════════════════════════════════════════════
//  SNAKE FACTORY
// ═══════════════════════════════════════════════════════
function makeSnake(x, y, skin, name, isPlayer) {
  const segs = [];
  for (let i = 0; i < 10; i++) {
    segs.push({ x: wrapCoord(x - i * SEG_R * 2), y });
  }
  return {
    segs,
    angle: 0,
    skin,
    name,
    isPlayer,
    alive: true,
    len: 10,      // target segment count
    fuel: 100,
    points: 0,
  };
}

// ═══════════════════════════════════════════════════════
//  ORB FACTORY
// ═══════════════════════════════════════════════════════
function makeOrb(x, y) {
  const hue = (Math.random() * 360) | 0;
  return {
    x: x != null ? x : Math.random() * WORLD,
    y: y != null ? y : Math.random() * WORLD,
    r: 4 + Math.random() * 5,
    hue,
  };
}

// ═══════════════════════════════════════════════════════
//  SPARK FACTORY
// ═══════════════════════════════════════════════════════
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1.5 + Math.random() * 4;
    sparks.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, r: 2+Math.random()*3, color });
  }
}

// ═══════════════════════════════════════════════════════
//  START GAME
// ═══════════════════════════════════════════════════════
function startGame() {
  pName   = document.getElementById('name-inp').value.trim() || 'Player';
  score   = 0;
  kills   = 0;
  born    = Date.now();
  sparks  = [];
  bots    = [];
  orbs    = [];

  // Orbs
  for (let i = 0; i < NUM_ORBS; i++) orbs.push(makeOrb());

  // Player at center
  const sx = WORLD / 2, sy = WORLD / 2;
  player = makeSnake(sx, sy, SKINS[skinIdx], pName, true);
  mX = W / 2; mY = H / 2 - 1; // default mouse slightly up

  // Camera snap
  camX = sx - W / 2;
  camY = sy - H / 2;

  // Bots
  for (let i = 0; i < NUM_BOTS; i++) {
    const bx = 400 + Math.random() * (WORLD - 800);
    const by = 400 + Math.random() * (WORLD - 800);
    const skin = SKINS[(skinIdx + 1 + i) % SKINS.length];
    bots.push({
      snake: makeSnake(bx, by, skin, BOT_NAMES[i % BOT_NAMES.length], false),
      timer: 0,
    });
  }

  show('none');
  running = true;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tick);
}

// ═══════════════════════════════════════════════════════
//  SHOW / HIDE SCREENS
// ═══════════════════════════════════════════════════════
function show(which) {
  document.getElementById('start-screen').classList.toggle('hidden', which !== 'start');
  document.getElementById('death-screen').classList.toggle('hidden', which !== 'death');
  document.getElementById('hud').classList.toggle('hidden', which === 'start' || which === 'death');
  document.getElementById('minimap-wrap').classList.toggle('hidden', which !== 'none');
  // Always show minimap canvas
  mm.style.display = which === 'none' ? 'block' : 'none';
}

// Show start at load
show('start');

// ═══════════════════════════════════════════════════════
//  STEER
// ═══════════════════════════════════════════════════════
function steerSnake(snake) {
  // target angle = direction of mouse from screen center
  const tx = mX - W / 2;
  const ty = mY - H / 2;
  const target = Math.atan2(ty, tx);

  let diff = target - snake.angle;
  while (diff >  Math.PI) diff -= 2 * Math.PI;
  while (diff < -Math.PI) diff += 2 * Math.PI;
  snake.angle += Math.sign(diff) * Math.min(Math.abs(diff), TURN);
}

function steerBot(bot) {
  const s = bot.snake;
  const head = s.segs[0];

  bot.timer--;
  if (bot.timer <= 0) {
    // Pick nearest orb
    let best = null, bd = Infinity;
    for (const o of orbs) {
      const d = dist2(head.x, head.y, o.x, o.y);
      if (d < bd) { bd = d; best = o; }
    }
    if (best) {
      bot.targetAngle = angleTo(head.x, head.y, best.x, best.y);
    } else {
      bot.targetAngle = (bot.targetAngle || 0) + (Math.random() - 0.5) * 1.2;
    }
    bot.timer = 30 + (Math.random() * 60) | 0;
  }

  // Edge avoidance
  const m = 180;
  if (head.x < m)          bot.targetAngle = 0;
  if (head.x > WORLD - m)  bot.targetAngle = Math.PI;
  if (head.y < m)          bot.targetAngle = Math.PI / 2;
  if (head.y > WORLD - m)  bot.targetAngle = -Math.PI / 2;

  let diff = bot.targetAngle - s.angle;
  while (diff >  Math.PI) diff -= 2 * Math.PI;
  while (diff < -Math.PI) diff += 2 * Math.PI;
  s.angle += Math.sign(diff) * Math.min(Math.abs(diff), TURN * 0.75);
}

// ═══════════════════════════════════════════════════════
//  MOVE
// ═══════════════════════════════════════════════════════
function moveSnake(snake) {
  const boosting = snake.isPlayer ? (pressing && snake.fuel > 0) : false;
  snake.boosting = boosting;
  const spd = boosting ? BOOST_SPD : SPEED;

  if (boosting) {
    snake.fuel = Math.max(0, snake.fuel - 0.5);
    // Shed a tiny orb while boosting
    if (Math.random() < 0.3) {
      const tail = snake.segs[snake.segs.length - 1];
      orbs.push(makeOrb(tail.x + (Math.random()-0.5)*8, tail.y + (Math.random()-0.5)*8));
    }
  } else {
    snake.fuel = Math.min(100, snake.fuel + 0.18);
  }

  const head = snake.segs[0];
  const nx = wrapCoord(head.x + Math.cos(snake.angle) * spd);
  const ny = wrapCoord(head.y + Math.sin(snake.angle) * spd);
  snake.segs.unshift({ x: nx, y: ny });

  // Trim to target length (each seg = SEG_R*2 spacing ideally, but we just use count)
  while (snake.segs.length > snake.len) snake.segs.pop();
}

// ═══════════════════════════════════════════════════════
//  EAT ORBS
// ═══════════════════════════════════════════════════════
function eatOrbs(snake) {
  const head = snake.segs[0];
  const eat_r2 = (SEG_R + 8) ** 2;
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    if (dist2(head.x, head.y, o.x, o.y) < eat_r2) {
      snake.len    += 1;
      snake.points += (o.r | 0);
      if (snake.isPlayer) score += (o.r | 0);
      burst(o.x, o.y, `hsl(${o.hue},80%,60%)`, 4);
      orbs.splice(i, 1);
      orbs.push(makeOrb()); // respawn elsewhere
    }
  }
}

// ═══════════════════════════════════════════════════════
//  COLLISIONS
// ═══════════════════════════════════════════════════════
function checkCollisions() {
  const all = [player, ...bots.map(b => b.snake)].filter(s => s && s.alive);

  for (const s of all) {
    if (!s.alive) continue;
    const hx = s.segs[0].x, hy = s.segs[0].y;
    const kill_r2 = (SEG_R * 1.4) ** 2;

    for (const other of all) {
      if (!other.alive) continue;
      const skip = s === other ? 6 : 0;
      for (let i = skip; i < other.segs.length; i++) {
        const seg = other.segs[i];
        if (dist2(hx, hy, seg.x, seg.y) < kill_r2) {
          die(s);
          break;
        }
      }
      if (!s.alive) break;
    }
  }
}

function die(snake) {
  snake.alive = false;
  const count = Math.min(snake.segs.length, 20 + snake.len);
  for (let i = 0; i < count; i++) {
    const seg = snake.segs[(Math.random() * snake.segs.length) | 0];
    orbs.push(makeOrb(seg.x + (Math.random()-0.5)*20, seg.y + (Math.random()-0.5)*20));
  }
  burst(snake.segs[0].x, snake.segs[0].y, snake.skin.h, 24);

  if (snake.isPlayer) {
    running = false;
    const secs = Math.floor((Date.now() - born) / 1000);
    document.getElementById('death-stats').innerHTML =
      `Score <b>${score}</b><br>Length <b>${snake.len}</b><br>` +
      `Kills <b>${kills}</b><br>Time <b>${Math.floor(secs/60)}m ${secs%60}s</b>`;
    show('death');
  }
}

// ═══════════════════════════════════════════════════════
//  RESPAWN BOTS
// ═══════════════════════════════════════════════════════
function respawnBots() {
  for (const bot of bots) {
    if (!bot.snake.alive) {
      const bx = 400 + Math.random() * (WORLD - 800);
      const by = 400 + Math.random() * (WORLD - 800);
      bot.snake = makeSnake(bx, by, bot.snake.skin, bot.snake.name, false);
      bot.timer = 0;
    }
  }
}

// ═══════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════
function updateCam() {
  if (!player || !player.alive) return;
  const hx = player.segs[0].x, hy = player.segs[0].y;
  camX += ((hx - W / 2) - camX) * 0.1;
  camY += ((hy - H / 2) - camY) * 0.1;
}

// ═══════════════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════════════
function toScreen(wx, wy) {
  return [wx - camX, wy - camY];
}

function inView(sx, sy, pad = 20) {
  return sx > -pad && sx < W + pad && sy > -pad && sy < H + pad;
}

function drawBackground() {
  ctx.fillStyle = '#0a1a0a';
  ctx.fillRect(0, 0, W, H);

  // Grid
  const gs = 80;
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 1;
  const ox = (-camX % gs + gs) % gs;
  const oy = (-camY % gs + gs) % gs;
  ctx.beginPath();
  for (let x = ox; x < W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = oy; y < H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // Border
  const [bx, by] = toScreen(0, 0);
  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 5;
  ctx.shadowColor = '#4ade80';
  ctx.shadowBlur = 18;
  ctx.strokeRect(bx, by, WORLD, WORLD);
  ctx.shadowBlur = 0;
}

function drawOrbs(t) {
  for (const o of orbs) {
    const [sx, sy] = toScreen(o.x, o.y);
    if (!inView(sx, sy, 20)) continue;
    const pulse = o.r * (0.85 + 0.15 * Math.sin(t * 0.002 + o.x));
    ctx.beginPath();
    ctx.arc(sx, sy, pulse, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${o.hue},80%,60%)`;
    ctx.shadowColor = `hsl(${o.hue},80%,80%)`;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawSnake(snake) {
  if (!snake.alive) return;
  const segs = snake.segs;
  if (segs.length < 2) return;

  // Body
  for (let i = segs.length - 1; i >= 1; i--) {
    const [sx, sy] = toScreen(segs[i].x, segs[i].y);
    if (!inView(sx, sy, SEG_R * 2)) continue;
    const t = i / segs.length;
    const r = SEG_R * (1 - t * 0.25);
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fillStyle = snake.skin.b;
    ctx.fill();
    if (i % 4 === 0) {
      ctx.beginPath();
      ctx.arc(sx, sy, r * 0.55, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fill();
    }
  }

  // Head
  const [hx, hy] = toScreen(segs[0].x, segs[0].y);
  const hr = SEG_R * 1.3;

  if (snake.boosting) {
    ctx.beginPath();
    ctx.arc(hx, hy, hr * 1.6, 0, Math.PI * 2);
    ctx.fillStyle = snake.skin.h + '33';
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(hx, hy, hr, 0, Math.PI * 2);
  ctx.fillStyle = snake.skin.h;
  ctx.shadowColor = snake.skin.h;
  ctx.shadowBlur = snake.boosting ? 16 : 6;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Eyes
  const ea = hr * 0.42;
  const a = snake.angle;
  for (const s of [-1, 1]) {
    const ex = hx + Math.cos(a + s * 0.52) * ea;
    const ey = hy + Math.sin(a + s * 0.52) * ea;
    ctx.beginPath(); ctx.arc(ex, ey, hr * 0.26, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex + Math.cos(a)*hr*0.08, ey + Math.sin(a)*hr*0.08, hr*0.13, 0, Math.PI*2);
    ctx.fillStyle = '#111'; ctx.fill();
  }

  // Name
  ctx.font = 'bold 11px Segoe UI,Arial';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillText(snake.name, hx + 1, hy - hr - 5);
  ctx.fillStyle = '#fff';
  ctx.fillText(snake.name, hx, hy - hr - 6);

  // Fuel bar (player)
  if (snake.isPlayer) {
    const bw = 48, bh = 4;
    const bx2 = hx - bw/2, by2 = hy + hr + 5;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(bx2, by2, bw, bh);
    const pct = snake.fuel / 100;
    ctx.fillStyle = pct > 0.5 ? '#4ade80' : pct > 0.25 ? '#fbbf24' : '#f87171';
    ctx.fillRect(bx2, by2, bw * pct, bh);
  }
}

function drawSparks() {
  for (const p of sparks) {
    const [sx, sy] = toScreen(p.x, p.y);
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(sx, sy, p.r * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMinimap() {
  const mw = mm.width, mh = mm.height;
  const sc = mw / WORLD;
  mctx.fillStyle = 'rgba(5,10,5,0.9)';
  mctx.fillRect(0, 0, mw, mh);

  mctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (const o of orbs) {
    mctx.fillRect(o.x * sc, o.y * sc, 1, 1);
  }

  for (const bot of bots) {
    if (!bot.snake.alive) continue;
    const h = bot.snake.segs[0];
    mctx.fillStyle = bot.snake.skin.h;
    mctx.fillRect(h.x*sc - 2, h.y*sc - 2, 4, 4);
  }

  if (player && player.alive) {
    const h = player.segs[0];
    mctx.fillStyle = '#fff';
    mctx.fillRect(h.x*sc - 3, h.y*sc - 3, 6, 6);
    mctx.strokeStyle = 'rgba(255,255,255,0.25)';
    mctx.lineWidth = 1;
    mctx.strokeRect(camX*sc, camY*sc, W*sc, H*sc);
  }
}

function updateHUD() {
  document.getElementById('sv').textContent = score;
  document.getElementById('lv').textContent = `Length ${player?.len ?? 0}`;

  const rows = [
    player ? { name: pName, pts: score, me: true } : null,
    ...bots.filter(b => b.snake.alive).map(b => ({ name: b.snake.name, pts: b.snake.points, me: false })),
  ].filter(Boolean).sort((a,b) => b.pts - a.pts).slice(0, 7);

  document.getElementById('lb-rows').innerHTML = rows.map((r, i) =>
    `<div class="lb-row${r.me ? ' lb-me' : ''}">
      <span>${i+1}. ${r.name}</span><span>${r.pts}</span>
    </div>`
  ).join('');
}

// ═══════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════
function tick(t) {
  rafId = requestAnimationFrame(tick);
  if (!running) return;

  // Update
  if (player && player.alive) {
    steerSnake(player);
    moveSnake(player);
    eatOrbs(player);
  }

  for (const bot of bots) {
    if (bot.snake.alive) {
      steerBot(bot);
      moveSnake(bot.snake);
      eatOrbs(bot.snake);
    }
  }

  checkCollisions();
  respawnBots();

  // Update sparks
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.x  += p.vx; p.y  += p.vy;
    p.vx *= 0.93; p.vy *= 0.93;
    p.life -= 0.028;
    if (p.life <= 0) sparks.splice(i, 1);
  }

  // Orb count
  while (orbs.length < NUM_ORBS) orbs.push(makeOrb());

  updateCam();

  // Draw
  drawBackground();
  drawOrbs(t);
  for (const bot of bots) drawSnake(bot.snake);
  if (player) drawSnake(player);
  drawSparks();
  updateHUD();
  drawMinimap();
}

// ═══════════════════════════════════════════════════════
//  UI WIRING
// ═══════════════════════════════════════════════════════
document.getElementById('play-btn').addEventListener('click', startGame);
document.getElementById('name-inp').addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
document.getElementById('retry-btn').addEventListener('click', startGame);

// Kick off idle render loop (black canvas, start screen visible)
rafId = requestAnimationFrame(tick);
</script>
