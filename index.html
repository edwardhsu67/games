<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games by Edward</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  h1 {
    font-size: 48px;
    font-weight: 900;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #4ade80, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p.sub { color: #64748b; margin-bottom: 48px; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 32px;
    width: 220px;
    text-align: center;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: #4ade80;
    box-shadow: 0 0 30px #4ade8033;
  }
  .card .icon { font-size: 56px; margin-bottom: 14px; }
  .card h2 { font-size: 20px; margin-bottom: 6px; }
  .card p { font-size: 13px; color: #64748b; }
</style>
</head>
<body>
  <h1>Games</h1>
  <p class="sub">by Edward</p>
  <div class="grid">
    <a class="card" href="/games/snake/">
      <div class="icon">🐍</div>
      <h2>Snake.io</h2>
      <p>Eat orbs, grow bigger, outlast everyone</p>
    </a>
  </div>
</body>
</html>
